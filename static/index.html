<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>披露前评审</h2><div class="grid"><input id="assignees" placeholder="评审人 ID，逗号分隔"><input id="reviewnote" placeholder="评审说明"><input id="round" type="number" placeholder="评审批次 ID"><select id="decision"><option value="approve">赞同</option><option value="object">反对</option></select><input id="votecomment" placeholder="表态说明（反对必填理由）"></div><button onclick="startReview()">发起评审</button><button onclick="vote()">提交表态</button><button onclick="reviewView()">查看评审结论</button><div class="grid"><input id="veradd" placeholder="新增版本，逗号分隔"><input id="verdel" placeholder="移除版本，逗号分隔"><input id="verreason" placeholder="更正原因（至少5字）"></div><button onclick="correct()">提交版本更正</button><pre id="review"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><script>const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);async function get(u,el='#result'){show(el,await(await fetch(u)).json())}async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function view(){get('/api/reports/'+report.value+'?user_id='+user.value)}function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value})}function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}const ids=s=>s.split(',').map(x=>+x.trim()).filter(x=>x>0);const vers=s=>s.split(',').map(x=>x.trim()).filter(x=>x);function startReview(){post('/api/reviews',{report_id:+report.value,coordinator_id:+coord.value,assignee_ids:ids(assignees.value),note:reviewnote.value},'#review')}function vote(){post('/api/reviews/'+round.value+'/votes',{user_id:+user.value,decision:decision.value,comment:votecomment.value},'#review')}function correct(){post('/api/version_corrections',{report_id:+report.value,user_id:+user.value,add:vers(veradd.value),remove:vers(verdel.value),reason:verreason.value},'#review')}async function reviewView(){const r=await(await fetch('/api/reports/'+report.value+'?user_id='+user.value)).json();if(!r.reviews){show('#review',r);return}const cn={approved:'已通过',blocked:'存在反对（披露暂停）',pending:'等待表态',superseded:'已被新批次取代'};const L=[];for(const rd of r.reviews){L.push('批次 #'+rd.id+' ['+cn[rd.conclusion]+'] '+(rd.note||''));L.push('  评审人: '+rd.assignees.map(a=>a.name+'('+a.user_id+')').join('、'));if(rd.pending.length)L.push('  未表态: '+rd.pending.map(a=>a.name).join('、'));for(const v of rd.votes)L.push('  '+v.created_at+' '+v.name+': '+(v.decision==='approve'?'赞同':'反对')+(v.comment?' — '+v.comment:''))}if(r.version_corrections.length){L.push('版本更正历史:');for(const c of r.version_corrections)L.push('  '+c.created_at+' '+c.changed_by_name+' '+(c.action==='add'?'新增':'移除')+' '+c.version_key+' — '+c.reason)}document.querySelector('#review').textContent=L.join('\n')||'尚无评审批次'}state()</script></html>
