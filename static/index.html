<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.blocked{color:#a00;font-weight:600}.approved{color:#070;font-weight:600}#panel li{margin:2px 0}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>披露前评审</h2><div class="grid"><input id="rvAssignees" placeholder="必须表态的用户 ID，逗号分隔"><input id="rvNote" placeholder="批次说明"><input id="rvRound" type="number" placeholder="批次 ID"><input id="rvComment" placeholder="表态意见（反对必填，至少5字）"><input id="rvAdd" placeholder="补充版本，逗号分隔"><input id="rvDel" placeholder="移除版本，逗号分隔"><input id="rvReason" placeholder="版本更正原因（至少5字）"></div><button onclick="startRound()">发起评审批次</button><button onclick="vote('approve')">赞同</button><button onclick="vote('object')">反对</button><button onclick="correct()">提交版本更正</button><button onclick="panel()">查看评审结论</button><div id="panel"></div><pre id="review"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><script>const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const ids=s=>s.split(',').map(x=>x.trim()).filter(Boolean).map(Number);async function get(u,el='#result'){show(el,await(await fetch(u)).json())}async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function view(){get('/api/reports/'+report.value+'?user_id='+user.value)}function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value})}function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}function startRound(){post('/api/reviews',{report_id:+el('report').value,coordinator_id:+el('coord').value,assignee_ids:ids(el('rvAssignees').value),note:el('rvNote').value},'#review')}function vote(decision){post('/api/reviews/'+el('rvRound').value+'/vote',{user_id:+el('user').value,decision:decision,comment:el('rvComment').value},'#review')}function correct(){post('/api/reports/'+el('report').value+'/versions',{user_id:+el('user').value,add:el('rvAdd').value.split(',').map(x=>x.trim()).filter(Boolean),remove:el('rvDel').value.split(',').map(x=>x.trim()).filter(Boolean),reason:el('rvReason').value},'#review')}const ROUND={open:'评审中',approved:'已通过',blocked:'有未处理反对',superseded:'已被新批次取代'};const DEC={approve:'赞同',object:'反对'};async function panel(){const d=await(await fetch('/api/reports/'+el('report').value+'?user_id='+el('user').value)).json();show('#review',d);if(d.error){el('panel').innerHTML='';return}const rounds=d.reviews||[];const cur=[...rounds].reverse().find(r=>r.status!=='superseded');let h='';if(cur){h+='<p>当前结论: <span class="'+(cur.status==='blocked'?'blocked':cur.status==='approved'?'approved':'')+'">第 '+cur.round_no+' 轮 '+ROUND[cur.status]+'</span>';h+=cur.pending.length?' — 未表态: '+cur.pending.map(a=>esc(a.name)).join('、'):' — 全员已表态';h+='</p>'}else h+='<p>尚未发起评审</p>';for(const r of rounds){h+='<h3>第 '+r.round_no+' 轮（'+ROUND[r.status]+'）'+esc(r.note||'')+'</h3><ul>';for(const a of r.assignees){const v=r.votes.find(v=>v.user_id===a.user_id);h+='<li>'+esc(a.name)+': '+(v?DEC[v.decision]+(v.comment?' — '+esc(v.comment):''):'<b>未表态</b>')+'</li>'}h+='</ul>'}h+='<h3>版本更正记录</h3>';const cs=d.version_corrections||[];h+=cs.length?'<ul>'+cs.map(c=>'<li>'+esc(c.created_at)+' '+esc(c.changed_by_name)+' '+(c.action==='add'?'补充':'移除')+' '+esc(c.version_key)+'（原因: '+esc(c.reason)+'）</li>').join('')+'</ul>':'<p>暂无更正</p>';el('panel').innerHTML=h}state()</script></html>
